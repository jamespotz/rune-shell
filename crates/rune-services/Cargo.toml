[package]
name = "rune-services"
version = "0.1.0"
edition = "2024"

[dependencies]
libc = { workspace = true }
chrono = { workspace = true }
chrono-tz = "0.10"
futures-util = "0.3"
image = { workspace = true }
material-colors = { version = "0.5", features = ["quantize"] }
serde = { workspace = true }
serde_json = "1"
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "net", "io-util", "sync", "time", "macros", "process", "fs"] }
tracing = { workspace = true }
zbus = { workspace = true }

[dev-dependencies]
toml = "1"
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
