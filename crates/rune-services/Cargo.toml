[package]
name = "rune-services"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
chrono-tz = "0.10"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
material-colors = { version = "0.5", features = ["quantize"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "time", "macros", "process"] }
tracing = "0.1"
zbus = { version = "5", default-features = false, features = ["tokio"] }
