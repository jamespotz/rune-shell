[package]
name = "rune-ui"
version = "0.1.0"
edition = "2024"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
unicode-segmentation = "1"
uuid = { version = "1", features = ["v5"] }
futures = "0.3"
anyhow = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
rune-services = { version = "0.1.0", path = "../rune-services" }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
toml = "1"
tracing = "0.1.44"
nucleo-matcher = "0.3"
emojis = "0.9"

# Immutable upstream revision with native Wayland layer-shell support.
gpui = { git = "https://github.com/zed-industries/zed", rev = "917559da35dd4d626205da705b071c800c9c2553", default-features = false, features = ["wayland"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "917559da35dd4d626205da705b071c800c9c2553", default-features = false, features = ["wayland"] }
