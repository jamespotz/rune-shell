[package]
name = "rune-ui"
version = "0.1.0"
edition = "2024"

[dependencies]
image = { workspace = true }
unicode-segmentation = "1"
uuid = { version = "1", features = ["v5"] }
futures = "0.3"
anyhow = { workspace = true }
chrono = { workspace = true }
rune-services = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
toml = "1"
tracing = { workspace = true }
nucleo-matcher = "0.3"
emojis = "0.9"

# Immutable upstream revision with native Wayland layer-shell support.
gpui = { git = "https://github.com/zed-industries/zed", rev = "917559da35dd4d626205da705b071c800c9c2553", default-features = false, features = ["wayland"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "917559da35dd4d626205da705b071c800c9c2553", default-features = false, features = ["wayland"] }

[lints]
workspace = true
