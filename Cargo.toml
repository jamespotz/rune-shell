[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.dependencies]
libc = "0.2"
cosmic-text = "0.19"
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
rune-services = { version = "0.1.0", path = "crates/rune-services" }
rune-ui = { version = "0.1.0", path = "crates/rune-ui" }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2"
tokio = "1"
tracing = "0.1.44"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[workspace.lints.clippy]
cast_possible_wrap = "warn"
format_push_string = "warn"
undocumented_unsafe_blocks = "warn"

[patch."https://github.com/zed-industries/zed"]
# Keep layer-shell stretch dimensions out of wp_viewport destinations during startup.
gpui_linux = { path = "vendor/gpui_linux" }
