# Rune Shell config: copy to ~/.config/rune-shell/config.toml.
# Every key is optional; the values below are the defaults. Saving reloads the shell.
# The settings window (rune-shell toggle settings) edits this file too, without comments.

# For a notch: width = 600, radius = 14, margin_top = 0.
# For a floating bar: margin_top = 6, margin_x = 8, radius = 10.
[bar]
height = 32               # logical px
width = 0                 # 0 fills the monitor between the side gaps
radius = 0.0              # corner rounding; only bottom corners when margin_top = 0
margin_top = 0            # space above the bar
margin_x = 0              # space left and right of the bar
padding = 6.0             # notch side -> outermost widget
spacing = 10.0            # between widgets (sections get twice this)
gap = 8                   # space between the bar and the windows below
font = "Noto Sans"
font_size = 13.0
blur = false              # blur behind the notch (needs a transparent background color)
look = "smooth"           # "smooth" (rounded, soft) or "pixel" (square frames, pixel font)
pixel_font = "tiny5"      # pixel look font: "tiny5" or "monocraft"
icon_font = "Material Symbols Rounded"  # icons are written by name, e.g. "schedule"
outputs = []              # e.g. ["DP-1"]; empty = every monitor
# Widgets: "workspaces", "window_title", "clock", "media", "notifications", "tray",
# "weather", "bluetooth", "volume", "network", "battery", "stats", "quick_settings", "power", "capture",
# "settings". Reorder freely;
# the three lists are laid out left to right inside the notch.
left = ["workspaces"]
center = ["media", "window_title"]
right = ["tray", "bluetooth", "network", "volume", "battery", "weather", "clock", "notifications", "quick_settings"]

[workspaces]
min = 5                   # 1..=min are always shown

[clock]
format = "%a %d %b  %H:%M" # strftime
icon = "schedule"         # icon name; "" for none

[window_title]
max_chars = 50            # longer titles end in "…"

[notifications]
timeout_ms = 5000         # popups, when the app doesn't say
history = 100             # kept in the notification center
dnd = false               # do not disturb: only critical notifications pop up

[weather]                 # pick the place in Settings → Weather; empty location = off
location = ""
latitude = 0.0
longitude = 0.0
imperial = false          # °F and mph

[calendar]                # ICS links; Google: calendar settings → "Secret address in iCal format"
urls = []
remind_minutes = 10       # notify this long before timed events; 0 turns reminders off

[power]
lock_command = "loginctl lock-session"   # e.g. "hyprlock"

[capture]                 # rune-shell screenshot / record / ocr
screenshot_dir = "~/Pictures/Screenshots"
copy = true               # also copy screenshots to the clipboard
record_dir = "~/Videos/Recordings"
record_audio = true
fps = 60
ocr_lang = "eng"          # tesseract languages, e.g. "eng+deu"

[launcher]
terminal = "kitty"          # runs Terminal=true apps as `<terminal> -e <command>`

[theme]                   # applying a theme rewrites [colors] and the listed apps' themes
source = "preset"         # "preset" or "wallpaper"
preset = "Catppuccin Mocha"
scheme = "tonal_spot"     # wallpaper themes: tonal_spot, vibrant, expressive, fruit_salad, ...
dark = true               # wallpaper themes only
apps = []                 # kitty, ghostty, btop, yazi, nvim, zed, vscode, kiro, gtk3, gtk4, qt, kde

[wallpaper]
dir = "~/Pictures/Wallpapers"
current = ""

[animations]
enabled = true
duration_ms = 250
reduce_motion = false     # overrides everything above

[colors]                  # Graphite; "#rrggbb" or "#rrggbbaa"
background = "#202227"
foreground = "#f5f5f7"
accent = "#66b1ff"
on_accent = "#101a28"
muted = "#a6aab5"
urgent = "#ff7b81"
